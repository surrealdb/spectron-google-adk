[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-memory-google-adk"
version = "0.4.0"
description = "SurrealDB AgentMemory memory as tools for Google Agent Development Kit (ADK) agents."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SurrealDB" }]
keywords = ["surrealdb", "agent_memory", "google-adk", "adk", "agent", "memory", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "google-adk>=2.5.0",
    # The AgentMemory client ships in the base surrealdb package under the
    # surrealdb.memory subpackage. It is published to PyPI from v3 alpha 4
    # (3.0.0a4); the pre-release pin lets pip install the alpha while still
    # accepting later finals (3.0.0, 3.1.0, ...).
    "surrealdb[memory]>=3.0.0b8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://surrealdb.com/agent-memory"
Documentation = "https://surrealdb.com/docs/learn/agent_memory"
Repository = "https://github.com/surrealdb/agent-memory-google-adk"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory_google_adk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
